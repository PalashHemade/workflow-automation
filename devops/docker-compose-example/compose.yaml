services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/gitinsight?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@db:5432/gitinsight?schema=public"
    env_file:
      - ../.env
    depends_on:
      - db
    networks:
      - gitinsight-net

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gitinsight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - gitinsight-net

volumes:
  pgdata:

networks:
  gitinsight-net:
    driver: bridge
