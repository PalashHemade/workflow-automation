---
- name: Configure Web Servers
  hosts: webservers
  become: yes
  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Start Nginx
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Deploy Web Page
      copy:
        content: |
          <h1>Web Server Configured Using Ansible</h1>
        dest: /var/www/html/index.html
